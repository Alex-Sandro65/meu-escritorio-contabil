    /* Sidebar */
    .sidebar-link { display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:14px; color:#bfdbfe; transition:background .15s; border-radius:6px; margin:2px 8px; cursor:pointer; text-decoration:none; }
    .sidebar-link:hover, .sidebar-link.active { background:#1e40af; color:white; }

    /* Sidebar mobile slide */
    #sidebar { transition: transform 0.28s cubic-bezier(.4,0,.2,1); }
    #overlay  { transition: opacity 0.28s ease; }

    /* Animações */
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* Cards */
    .card { background:white; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.1); }

    /* Badges */
    .badge-green  { background:#dcfce7; color:#15803d; }
    .badge-yellow { background:#fef9c3; color:#a16207; }
    .badge-red    { background:#fee2e2; color:#b91c1c; }
    .badge-blue   { background:#dbeafe; color:#1d4ed8; }
    .status-badge { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; white-space:nowrap; }

    /* Score bar */
    .score-bar { transition: width .6s ease; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#f1f5f9; }
    ::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:3px; }

    /* Bottom nav (mobile) */
    #bottom-nav { display:none; }
    @media (max-width: 767px) {
      #bottom-nav { display:flex; }
      #main-content { padding-bottom: 72px; }
    }

    /* Tabelas responsivas no mobile */
    @media (max-width: 767px) {
      .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .hide-mobile { display: none !important; }
      .topbar-selects { display: none; }
    }

// ─────────────────────────────────────────────
// SIDEBAR / NAV
// ─────────────────────────────────────────────
function openSidebar() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('overlay');
  s.classList.remove('-translate-x-full');
  o.classList.remove('hidden');
  setTimeout(() => o.classList.remove('opacity-0'), 10);
}
function closeSidebar() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('overlay');
  s.classList.add('-translate-x-full');
  o.classList.add('opacity-0');
  setTimeout(() => o.classList.add('hidden'), 280);
}

const PAGE_TITLES = {
  dashboard:'Dashboard', balancete:'Balancetes', conciliacao:'Conciliações',
  auditoria:'Auditoria', sped:'SPED ECD/ECF', relatorios:'Relatórios',
  empresas:'Empresas', config:'Configurações', integracoes:'Integrações',
};

function navTo(name) {
  showPage(name);
  closeSidebar();
  // Bottom nav highlight
  document.querySelectorAll('.bnav-btn').forEach(b => {
    b.classList.remove('text-blue-600');
    b.classList.add('text-gray-500');
  });
  const bb = document.getElementById('bnav-' + name);
  if (bb) { bb.classList.add('text-blue-600'); bb.classList.remove('text-gray-500'); }
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const pg = document.getElementById('page-' + name);
  if (!pg) return;
  pg.classList.remove('hidden');
  pg.classList.add('fade-in');
  document.getElementById('nav-' + name)?.classList.add('active');
  document.getElementById('topbar-title').textContent = PAGE_TITLES[name] || name;
  renderPage(name);
}

function renderPage(name) {
  const el = document.getElementById('page-' + name);
  if (el.dataset.rendered) return;
  el.dataset.rendered = '1';
  const fn = PAGES[name];
  if (fn) el.innerHTML = fn();
  if (name === 'dashboard') initCharts();
}

function fmt(v) {
  if (!v && v !== 0) return '—';
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
}

function kpi(icon, val, label, cor) {
  const c = {
    blue:'bg-blue-50 border-blue-200 text-blue-800',
    green:'bg-green-50 border-green-200 text-green-800',
    red:'bg-red-50 border-red-200 text-red-800',
    yellow:'bg-yellow-50 border-yellow-200 text-yellow-800',
  };
  return `<div class="border rounded-xl p-4 ${c[cor]||c.blue}">
    <div class="text-2xl mb-1">${icon}</div>
    <div class="text-xl md:text-2xl font-bold">${val}</div>
    <div class="text-xs mt-1 opacity-75 leading-tight">${label}</div>
  </div>`;
}

function alertaIA(nivel, empresa, conta, msg) {
  const cor = nivel==='alto'?'red':nivel==='medio'?'yellow':'blue';
  const icon = nivel==='alto'?'🚨':nivel==='medio'?'⚠️':'💡';
  return `<div class="flex gap-3 p-3 bg-white border border-${cor}-100 rounded-lg">
    <span class="text-lg flex-shrink-0">${icon}</span>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 flex-wrap mb-0.5">
        <span class="text-xs font-bold text-${cor}-700 uppercase">${nivel}</span>
        <span class="text-xs text-gray-500">${empresa}</span>
        <span class="text-xs font-mono text-blue-600 truncate">${conta}</span>
      </div>
      <p class="text-sm text-gray-700">${msg}</p>
    </div>
  </div>`;
}

function indice(nome, formula, valor, ref, status, interp) {
  return `<div class="border rounded-lg p-3">
    <div class="font-medium text-gray-700 text-sm">${nome}</div>
    <div class="text-xs text-gray-400 font-mono">${formula}</div>
    <div class="text-xl md:text-2xl font-bold text-green-600 my-1">${valor}</div>
    <div class="text-xs text-gray-400">Ref: ${ref}</div>
    <div class="text-xs text-gray-500 mt-0.5 hidden md:block">${interp}</div>
  </div>`;
}

// CHARTS
// ─────────────────────────────────────────────
function initCharts() {
  const ctx1 = document.getElementById('chart-empresas');
  if (ctx1) new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: DEMO.empresas.map(e => e.nome.split(' ')[0]),
      datasets: [{
        label: 'Score (%)',
        data: DEMO.empresas.map(e => e.score),
        backgroundColor: DEMO.empresas.map(e => e.score>=90?'#16a34a':e.score>=70?'#f59e0b':'#dc2626'),
        borderRadius: 6,
      }],
    },
    options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}} }
  });

  const ctx2 = document.getElementById('chart-tipos');
  if (ctx2) new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Aprovadas','Em andamento','Divergência','Pendentes'],
      datasets: [{
        data: [3,1,4,1],
        backgroundColor: ['#16a34a','#2563eb','#dc2626','#f59e0b'],
        borderWidth: 2,
        borderColor: '#fff',
      }],
    },
    options: { responsive:true, plugins:{legend:{position:'bottom',labels:{font:{size:11}}}} }
  });
}
