function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const pg = document.getElementById('page-' + name);
  pg.classList.remove('hidden');
  pg.classList.add('fade-in');
  document.getElementById('nav-' + name)?.classList.add('active');
  document.getElementById('topbar-title').textContent = PAGE_TITLES[name] || name;
  renderPage(name);
}

function renderPage(name) {
  const el = document.getElementById('page-' + name);
  if (el.dataset.rendered) return;
  el.dataset.rendered = '1';
  const fn = PAGES[name];
  if (fn) el.innerHTML = fn();
  if (name === 'dashboard') initCharts();
}

// HELPERS
// ─────────────────────────────────────────────
function fmt(v) {
  if (!v && v!==0) return '—';
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
}

function kpi(icone, valor, label, cor) {
  const c = {blue:'bg-blue-50 border-blue-200 text-blue-800',green:'bg-green-50 border-green-200 text-green-800',red:'bg-red-50 border-red-200 text-red-800',yellow:'bg-yellow-50 border-yellow-200 text-yellow-800'};
  return `<div class="border rounded-xl p-4 ${c[cor]||c.blue}">
    <div class="text-2xl mb-1">${icone}</div>
    <div class="text-2xl font-bold">${valor}</div>
    <div class="text-xs mt-1 opacity-75">${label}</div>
  </div>`;
}

function alertaIA(nivel, empresa, conta, msg) {
  const cor = nivel==='alto'?'red':nivel==='medio'?'yellow':'blue';
  const icone = nivel==='alto'?'🚨':nivel==='medio'?'⚠️':'💡';
  return `<div class="flex gap-3 p-3 bg-white border border-${cor}-100 rounded-lg">
    <span class="text-lg">${icone}</span>
    <div class="flex-1">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-bold text-${cor}-700 uppercase">${nivel}</span>
        <span class="text-xs text-gray-500">${empresa}</span>
        <span class="text-xs font-mono text-blue-600">${conta}</span>
      </div>
      <p class="text-sm text-gray-700 mt-0.5">${msg}</p>
    </div>
  </div>`;
}

function indice(nome, formula, valor, ref, status, interp) {
  const c = status==='bom'?'green':'atencao'?'yellow':'red';
  return `<div class="border rounded-lg p-3">
    <div class="font-medium text-gray-700 text-sm">${nome}</div>
    <div class="text-xs text-gray-400 font-mono">${formula}</div>
    <div class="text-2xl font-bold text-${c}-600 my-1">${valor}</div>
    <div class="text-xs text-gray-400">Referência: ${ref}</div>
    <div class="text-xs text-gray-500 mt-1">${interp}</div>
  </div>`;
}

function passo(titulo, desc) {
  return `<div class="flex gap-3">
    <span class="w-5 h-5 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">→</span>

  </div>`;
}

function custo(servico, gratis, pago) {
  return `<tr class="border-b hover:bg-gray-50">
    <td class="px-3 py-2.5 font-medium text-gray-800">${servico}</td>
    <td class="px-3 py-2.5 text-green-600 text-xs">${gratis}</td>
    <td class="px-3 py-2.5 text-right text-gray-500 text-xs">${pago}</td>

}

        label: 'Score de Conciliação (%)',
        data: DEMO.empresas.map(e => e.score),
        backgroundColor: DEMO.empresas.map(e => e.score>=90?'#16a34a':e.score>=70?'#f59e0b':'#dc2626'),
        borderRadius: 6,
      }],
    },
    options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}} }
  });

  // Gráfico por tipo
  const ctx2 = document.getElementById('chart-tipos');
  if (ctx2) new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Aprovadas','Concluídas','Divergência','Pendentes'],
      datasets: [{
        data: [3, 1, 4, 1],
        backgroundColor: ['#16a34a','#2563eb','#dc2626','#f59e0b'],
        borderWidth: 2,
        borderColor: '#fff',
      }],
    },
    options: { responsive:true, plugins:{legend:{position:'bottom'}} }
  });
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  showPage('dashboard');
});
</script>
</body>
